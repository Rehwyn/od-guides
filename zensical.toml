[project]
site_name = "Rehwyn’s creator guides"
site_description = "Practical OurDream creator guides by Rehwyn"
site_author = "Rehwyn"
site_url = "https://rehwyn.github.io/od-guides/"
docs_dir = ".build/docs"
site_dir = ".build/www/od-guides"
use_directory_urls = true
# Generated from guides.json by build.py; build through the adapter.
nav = []
extra_css = ["extra.css"]
extra_javascript = ["extra.js"]

[project.theme]
language = "en"
font = false
features = ["toc.follow", "navigation.top", "search.highlight", "content.code.copy"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = "2-3"
pymdownx.superfences = {}
pymdownx.highlight.use_pygments = false
guide_toc = {}
